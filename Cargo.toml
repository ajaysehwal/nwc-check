[package]
name = "nwc-check"
version = "0.1.0"
edition = "2024"
description = "Conformance and safety checks for Nostr Wallet Connect (NIP-47) wallet services"
license = "MIT"
repository = "https://github.com/ajaysehwal/nwc-check"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
bitcoin_hashes = "1"
clap = { version = "4", features = ["derive", "env"] }
console = "0.16.6"
futures = "0.3.34"
indicatif = "0.18.6"
lightning-invoice = "0.34"
nostr = { version = "0.45", features = ["nip04", "nip44", "nip47"] }
nostr-sdk = "0.45"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"

[dev-dependencies]
bitcoin = "0.32"
nostr-sdk = { version = "0.45", features = ["local-relay"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
